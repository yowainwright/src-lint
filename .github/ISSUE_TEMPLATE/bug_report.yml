name: Bug report
description: Report an incorrect diagnostic, missed import, or crash.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, relevant source files, directory layout, and rc configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the diagnostic or output you received.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and platform
      description: Include src-lint --version (or commit), operating system, and architecture.
    validations:
      required: true
