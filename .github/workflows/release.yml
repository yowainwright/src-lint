name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to Homebrew
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name == 'push'
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-amd64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Verify tag version
        run: bash scripts/release.sh verify-version ./build/src-lint "$GITHUB_REF_NAME"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release
          cp build/src-lint "release/src-lint-$TARGET"
          cd release
          cmake -E sha256sum "src-lint-$TARGET" > "src-lint-$TARGET.sha256"
      - name: Attest binary
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/src-lint-${{ matrix.target }}
      - name: Package attestation
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TARGET: ${{ matrix.target }}
        run: cp "$BUNDLE_PATH" "release/src-lint-$TARGET.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: src-lint-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  sanitizers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSRC_LINT_SANITIZERS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  publish:
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Package source
        run: |
          package="src-lint-${GITHUB_REF_NAME#v}-source"
          git archive --format=tar.gz --prefix="$package/" -o "release/$package.tar.gz" "$GITHUB_SHA"
          cd release
          cmake -E sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          shasum -a 256 --check ./*.sha256
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag \
            --generate-notes --title "src-lint $GITHUB_REF_NAME"

  homebrew:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    needs: [publish]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Require tap token
        run: test -n "$GH_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yowainwright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Set up tap Ruby
        run: |
          brew list ruby >/dev/null 2>&1 || brew install ruby
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
      - name: Verify release and open tap PR
        run: bash scripts/release.sh homebrew-pr homebrew-tap "$RELEASE_TAG"
